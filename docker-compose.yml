version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mattermind_postgres
    environment:
      POSTGRES_USER: mattermind
      POSTGRES_PASSWORD: mattermind_secure_password_2026
      POSTGRES_DB: mattermind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermind -d mattermind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mattermind_backend
    environment:
      DATABASE_URL: postgresql://mattermind:mattermind_secure_password_2026@postgres:5432/mattermind_db
      SECRET_KEY: mattermind-super-secret-key-prod-2026
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: mattermind_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
